<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>《新闻课堂·少年观世界》作品展</title>
    <style>
        :root {
            --mint-bg: #e0f7fa;
            --brand-blue: #0288d1;
            --header-blue: #4fc3f7;
            --btn-yellow: #ffca28;
            --text-navy: #01579b;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--mint-bg);
            margin: 0; padding: 0; color: var(--text-navy);
            overflow-x: hidden;
            position: relative;
        }

        /* --- 首页样式 --- */
        .scrolling-logo {
            position: absolute;
            top: 25px; right: 25px; z-index: 10000; 
            width: 100px; height: 100px; 
            border: 4px solid white; border-radius: 20px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            background: white; pointer-events: none;
        }

        #entrance-page {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 0 8%; box-sizing: border-box;
            background: radial-gradient(circle at 70% 50%, rgba(79, 195, 247, 0.15), transparent);
        }

        .hero-left { flex: 1.2; text-align: left; z-index: 10; }
        .title-main { font-size: 3.8rem; margin: 0; color: var(--text-navy); white-space: nowrap; letter-spacing: 2px; }
        .title-sub { font-size: 1.6rem; color: #546e7a; margin: 5px 0 40px; text-align: right; max-width: 680px; }
        .intro-text { line-height: 2; font-size: 1.15rem; color: #37474f; max-width: 620px; text-align: justify; background: rgba(255,255,255,0.4); padding: 30px; border-radius: 20px; }
        .intro-text p { margin: 0 0 1.2em 0; text-indent: 2em; }
        .no-wrap { white-space: nowrap; }

        .visual-container { position: relative; display: flex; justify-content: center; align-items: center; animation: float 6s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }
        .hero-right .visual-container { width: 420px; height: 420px; }
        .earth-svg { filter: drop-shadow(0 15px 30px rgba(1, 87, 155, 0.1)); width: 100%; height: 100%; }
        .doodles-svg { position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }

        .btn-enter { margin-top: 50px; padding: 18px 60px; font-size: 1.3rem; font-weight: bold; color: #5f4300; background: var(--btn-yellow); border: none; border-radius: 100px; cursor: pointer; transition: 0.3s; box-shadow: 0 8px 0 #f57f17; }

      /* --- 页面2：主题列表（新版设计） --- */
        #themes-page {
            background-color: #e0f7fa; /* 薄荷蓝背景 */
            min-height: 100vh;
            padding-bottom: 60px;
            position: relative;
            overflow: hidden;
        }

        /* 背景装饰球 */
        .bg-orb { position: absolute; border-radius: 50%; opacity: 0.1; filter: blur(60px); pointer-events: none; }
        .orb-1 { top: -100px; right: -100px; width: 400px; height: 400px; background: #4fc3f7; }
        .orb-2 { bottom: -50px; left: -50px; width: 300px; height: 300px; background: #81c784; }

        /* 顶部报头 */
        .new-header {
            max-width: 1200px; margin: 0 auto 50px; padding: 60px 20px 30px;
            border-bottom: 2px dashed rgba(79, 195, 247, 0.5);
            display: flex; justify-content: space-between; align-items: flex-end;
            position: relative; z-index: 10;
        }
        
        .header-left .badge {
            display: inline-block; padding: 5px 12px; margin-bottom: 10px;
            background: var(--btn-yellow); color: #5f4300;
            font-size: 12px; font-weight: bold; border-radius: 20px;
            box-shadow: 0 2px 0 #f57f17; letter-spacing: 1px;
        }
        
        .header-left h1 {
            font-size: 4rem; color: var(--text-navy); margin: 0; line-height: 1; letter-spacing: -2px;
        }
        .header-left h1 span { color: var(--brand-blue); }
        .header-left p { color: #455a64; margin-top: 10px; font-size: 1.2rem; font-weight: 300; }
        
        .header-right { text-align: right; }
        .header-right .sub { color: #546e7a; font-size: 0.9rem; opacity: 0.8; }
        .header-right .main { color: var(--brand-blue); font-size: 1.2rem; font-weight: bold; }

        /* 网格布局：强制一行三个 (PC端) */
        .themes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 核心修改：强制3列 */
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative; z-index: 10;
        }

        /* 新版卡片样式 */
        .theme-card-new {
            background: white;
            border: 2px dashed #4fc3f7;
            border-radius: 25px;
            height: 260px; /* 固定高度 */
            padding: 25px;
            display: flex; flex-direction: column; justify-content: space-between;
            cursor: pointer; transition: all 0.3s ease;
            position: relative;
        }

        .theme-card-new:hover {
            transform: scale(1.02) translateY(-5px);
            border-style: solid; border-color: var(--brand-blue);
            box-shadow: 0 10px 30px rgba(1, 87, 155, 0.15);
        }

        /* 卡片内部元素 */
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .icon-box {
            width: 45px; height: 45px; background: #e1f5fe; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: var(--brand-blue);
            transition: 0.3s;
        }
        .theme-card-new:hover .icon-box { background: var(--brand-blue); color: white; }
        
        .card-meta { display: flex; flex-direction: column; margin-left: 10px; }
        .en-title { font-size: 10px; font-weight: bold; color: #90a4ae; letter-spacing: 1px; text-transform: uppercase; }
        .section-tag { font-size: 10px; font-weight: bold; color: var(--btn-yellow); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px;}

        .card-number {
            font-size: 3.5rem; font-weight: 900; color: #e0f7fa; line-height: 0.8;
            transition: 0.3s; user-select: none;
        }
        .theme-card-new:hover .card-number { color: #b3e5fc; }

        .card-content h2 {
            font-size: 1.8rem; margin: 0 0 10px; color: var(--text-navy);
            transition: 0.3s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .theme-card-new:hover h2 { transform: translateX(5px); }
        
        .deco-line { width: 40px; height: 4px; background: #4fc3f7; border-radius: 10px; margin-bottom: 12px; transition: 0.3s; }
        .theme-card-new:hover .deco-line { width: 70px; background: var(--btn-yellow); }

        .sub-title { font-size: 0.95rem; font-weight: bold; color: var(--brand-blue); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .desc { font-size: 0.8rem; color: #546e7a; margin-top: 4px; }

        /* 悬停箭头 */
        .hover-arrow {
            position: absolute; bottom: 25px; right: 25px;
            width: 40px; height: 40px; border-radius: 50%;
            background: #f5f5f5; color: #cfd8dc;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
            transition: 0.3s; opacity: 0.5;
        }
        .theme-card-new:hover .hover-arrow {
            background: var(--btn-yellow); color: #5f4300;
            opacity: 1; box-shadow: 0 4px 0 #f57f17; transform: translateY(-3px);
        }

        /* 手机适配 */
        @media (max-width: 768px) {
            .themes-grid { grid-template-columns: 1fr; } /* 手机单列 */
            .new-header { flex-direction: column; align-items: flex-start; text-align: left; }
            .header-right { margin-top: 20px; text-align: left; }
            .header-left h1 { font-size: 3rem; }
        }

        /* --- 页面3：详情页 --- */
        #detail-page { display: none; padding: 130px 20px 40px; }
        .works-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; max-width: 1400px; margin: 0 auto; }
        .work-box { background: white; border-radius: 25px; padding: 15px; border: 1px solid #ddd; display: flex; flex-direction: column; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.05); cursor: pointer; }
        .img-wrap { width: 100%; height: 230px; background: #f5f5f5; border-radius: 15px; overflow: hidden; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; }
        .img-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .praise-box { font-size: 0.85rem; color: #555; background: #fffde7; padding: 10px; border-radius: 10px; border-left: 4px solid var(--btn-yellow); flex-grow: 1; margin-top: 10px; }

        /* --- 弹窗样式 --- */
        .gallery-modal { display: none; position: fixed; z-index: 100001; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 15, 30, 0.95); backdrop-filter: blur(15px); justify-content: center; align-items: center; }
        .gallery-content { position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%; justify-content: center; }
        .gallery-img-container { width: 100%; height: 70vh; display: flex; justify-content: center; align-items: center; padding: 0 20px; box-sizing: border-box; }
        .gallery-img { max-width: 100%; max-height: 100%; border: 4px solid white; border-radius: 8px; object-fit: contain; }
        
        .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); font-size: 50px; color: white; cursor: pointer; background: rgba(255,255,255,0.1); width: 60px; height: 100px; display: flex; align-items: center; justify-content: center; z-index: 100005; user-select: none; }
        .prev-arrow { left: 0; border-radius: 0 15px 15px 0; }
        .next-arrow { right: 0; border-radius: 15px 0 0 15px; }

           /* --- 手机端适配：仅在此处修改，不影响网页端 --- */
        @media (max-width: 1024px) {
            .scrolling-logo { width: 60px; height: 60px; top: 15px; right: 15px; border-radius: 12px; }
            #entrance-page { flex-direction: column; padding: 80px 5% 40px; justify-content: flex-start; }
            .hero-left { order: 2; width: 100%; text-align: center; }
            .hero-right { order: 1; width: 100%; margin-bottom: 20px; }
            .hero-right .visual-container { width: 220px; height: 220px; margin: 0 auto; }
            .title-main { font-size: 2.2rem; white-space: normal; line-height: 1.2; }
            .title-sub { font-size: 1.2rem; text-align: center; margin: 10px 0 30px; }

            /* 核心：修复第二页顶栏居中 */
            .top-banner { padding: 100px 10px 30px; gap: 0; justify-content: space-between; }
            .banner-side-doodle { width: 60px !important; height: 60px !important; flex-shrink: 0; }
            
            .banner-text-content { 
                flex: 1; 
                min-width: 0; 
                display: flex; 
                flex-direction: column; 
                align-items: center; /* 确保内容垂直居中排列 */
                text-align: center; 
            }
            .banner-text-content h1 { 
                font-size: 5.8vw !important; /* 动态缩小字体 */
                white-space: nowrap !important; /* 绝对不换行 */
                display: block !important;
                width: 100% !important;
                text-align: center !important;
                margin: 0 auto !important;
                letter-spacing: 1px !important;
            }
            .banner-text-content button {
                margin: 15px auto 0 !important; /* 确保返回首页按钮居中 */
            }

            .nav-arrow { width: 45px; height: 80px; font-size: 35px; }
        }
    </style>
</head>
<body>

<img src="1718778821132.jpg" class="scrolling-logo">

    // ==========================================
    // 3. 全局状态
    // ==========================================
    let curWidx = 0;
    let currentGalleryList = []; // 新增：当前展示的所有作品列表（跨话题）

    // 基础切换
    function toggle(id) {
        document.getElementById('entrance-page').style.display = 'none';
        document.getElementById('themes-page').style.display = 'none';
        document.getElementById('detail-page').style.display = 'none';
        const el = document.getElementById(id);
        el.style.display = (id === 'entrance-page' ? 'flex' : 'block');
        window.scrollTo(0, 0);
    }

    function showEntrance() { toggle('entrance-page'); }
    
    function showThemes() { 
        toggle('themes-page');
        renderSections();
        // 重置导航文字
        document.querySelector('.new-header .main').innerText = "作品展";
        document.querySelector('.new-header button').innerText = "← 返回首页";
        document.querySelector('.new-header button').onclick = showEntrance;
    }

    // ==========================================
    // 4. 渲染板块 & 显示作品逻辑
    // ==========================================
    function renderSections() {
        const grid = document.getElementById('themes-container');
        grid.innerHTML = "";
        
        sectionsConfig.forEach(section => {
            const div = document.createElement('div');
            div.className = 'theme-card-new';
            // 核心修改：点击直接显示该板块下所有作品
            div.onclick = () => showSectionWorks(section); 
            
            div.innerHTML = `
                <div class="card-top">
                    <div style="display:flex; gap:10px;">
                        <div class="icon-box">${section.icon}</div>
                        <div class="card-meta">
                            <span class="en-title">${section.en}</span>
                            <span class="section-tag">SECTION</span>
                        </div>
                    </div>
                    <div class="card-number">${section.id}</div>
                </div>
                <div class="card-content">
                    <h2>${section.title}</h2>
                    <div class="deco-line"></div>
                    <p class="sub-title">${section.sub}</p>
                    <p class="desc">${section.desc}</p>
                </div>
                <div class="hover-arrow">➝</div>
            `;
            grid.appendChild(div);
        });
    }

    // 核心函数：点击板块，聚合展示所有作品
    function showSectionWorks(section) {
        currentGalleryList = []; // 清空当前列表

        // 1. 遍历该板块下的所有话题ID
        section.topicIds.forEach(tid => {
            const topicData = allThemesData[tid];
            if (topicData && topicData.works) {
                // 2. 将作品加入列表，并标记来源话题
                const labeledWorks = topicData.works.map(work => ({
                    ...work,
                    originTopic: topicData.title // 记录作品属于哪个话题
                }));
                currentGalleryList = currentGalleryList.concat(labeledWorks);
            }
        });

        // 3. 切换页面
        toggle('detail-page');
        
        // 4. 设置标题和返回按钮
        document.getElementById('theme-title').innerText = section.title + " · 精选作品";
        document.querySelector('#detail-page button').onclick = showThemes; // 返回大板块列表

        // 5. 渲染作品网格
        const container = document.getElementById('works-container');
        container.innerHTML = currentGalleryList.map((item, index) => `
            <div class="work-box" onclick="openGallery(${index})">
                <div class="img-wrap"><img src="${item.file}" onerror="if(this.src.indexOf('.jpg.jpg')==-1)this.src+='.jpg'"></div>
                <div style="padding:10px;">
                    <!-- 新增：显示来源话题的小标题 -->
                    <div style="font-size:0.75rem; color:#90a4ae; margin-bottom:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                        📌 ${item.originTopic.split(' ')[1] || item.originTopic}
                    </div>
                    <div style="color:var(--brand-blue); font-size:0.85rem;">${item.school}</div>
                    <div style="font-weight:bold; font-size:1.1rem; margin-top:2px;">${item.name}</div>
                </div>
                <div class="praise-box">🌟 ${item.praise}</div>
            </div>`).join('');
    }

    // ==========================================
    // 5. 弹窗逻辑 (修改为使用 currentGalleryList)
    // ==========================================
    function updateGalleryContent() {
        const item = currentGalleryList[curWidx]; // 改用全局列表
        const img = document.getElementById('galleryImg');
        img.src = item.file;
        img.onerror = function() { if(this.src.indexOf('.jpg.jpg')==-1) this.src+='.jpg'; };
        document.getElementById('gallery-school').innerText = item.school;
        document.getElementById('gallery-name').innerText = item.name + " (" + (item.originTopic.split(' ')[1] || "精选作品") + ")";
        document.getElementById('gallery-praise').innerText = "“" + item.praise + "”";
    }

    function openGallery(idx) {
        curWidx = idx;
        updateGalleryContent();
        document.getElementById('galleryModal').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }
    
    function changeGallery(dir) {
        const total = currentGalleryList.length; // 改用全局列表长度
        curWidx = (curWidx + dir + total) % total;
        updateGalleryContent();
    }
    
    function closeGallery() { 
        document.getElementById('galleryModal').style.display = 'none'; 
        document.body.style.overflow = 'auto'; 
    }

    // 初始化运行
    showEntrance();
</script>

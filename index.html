<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <style>
        :root {
            --mint-bg: #e0f7fa;
            --brand-blue: #0288d1;
            --header-blue: #4fc3f7;
            --btn-yellow: #ffca28;
            --text-navy: #01579b;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--mint-bg);
            margin: 0; padding: 0; color: var(--text-navy);
            overflow-x: hidden;
            position: relative;
        }

        /* --- 首页样式 --- */
        .scrolling-logo {
            position: absolute;
            top: 25px; right: 25px; z-index: 10000; 
            width: 100px; height: 100px; 
            border: 4px solid white; border-radius: 20px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            background: white; pointer-events: none;
        }

        #entrance-page {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 0 8%; box-sizing: border-box;
            background: radial-gradient(circle at 70% 50%, rgba(79, 195, 247, 0.15), transparent);
        }

        .hero-left { flex: 1.2; text-align: left; z-index: 10; }
        .title-main { font-size: 3.8rem; margin: 0; color: var(--text-navy); white-space: nowrap; letter-spacing: 2px; }
        .title-sub { font-size: 1.6rem; color: #546e7a; margin: 5px 0 40px; text-align: right; max-width: 680px; }
        .intro-text { line-height: 2; font-size: 1.15rem; color: #37474f; max-width: 620px; text-align: justify; background: rgba(255,255,255,0.4); padding: 30px; border-radius: 20px; }
        .intro-text p { margin: 0 0 1.2em 0; text-indent: 2em; }
        .no-wrap { white-space: nowrap; }

        .visual-container { position: relative; display: flex; justify-content: center; align-items: center; animation: float 6s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }
        .hero-right .visual-container { width: 420px; height: 420px; }
        .earth-svg { filter: drop-shadow(0 15px 30px rgba(1, 87, 155, 0.1)); width: 100%; height: 100%; }
        .doodles-svg { position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }

        .btn-enter { margin-top: 50px; padding: 18px 60px; font-size: 1.3rem; font-weight: bold; color: #5f4300; background: var(--btn-yellow); border: none; border-radius: 100px; cursor: pointer; transition: 0.3s; box-shadow: 0 8px 0 #f57f17; }

        /* --- 页面2：主题列表（网页端保持原状） --- */
        .top-banner { 
            background: var(--header-blue); 
            padding: 80px 20px 40px; 
            border-bottom: 8px solid var(--btn-yellow); 
            color: white; 
            text-align: center; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 50px; 
        }
        .banner-side-doodle { width: 150px; height: 150px; flex-shrink: 0; }
        .banner-text-content h1 { font-size: 3rem; margin: 0; letter-spacing: 3px; }

        .themes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .theme-card { background: white; border: 2px dashed var(--header-blue); border-radius: 25px; padding: 35px 20px; text-align: center; cursor: pointer; transition: 0.3s; font-weight: bold; min-height: 100px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

        /* --- 页面3：详情页 --- */
        #detail-page { display: none; padding: 130px 20px 40px; }
        .works-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; max-width: 1400px; margin: 0 auto; }
        .work-box { background: white; border-radius: 25px; padding: 15px; border: 1px solid #ddd; display: flex; flex-direction: column; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.05); cursor: pointer; }
        .img-wrap { width: 100%; height: 230px; background: #f5f5f5; border-radius: 15px; overflow: hidden; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; }
        .img-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .praise-box { font-size: 0.85rem; color: #555; background: #fffde7; padding: 10px; border-radius: 10px; border-left: 4px solid var(--btn-yellow); flex-grow: 1; margin-top: 10px; }

        /* --- 弹窗样式 --- */
        .gallery-modal { display: none; position: fixed; z-index: 100001; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 15, 30, 0.95); backdrop-filter: blur(15px); justify-content: center; align-items: center; }

        .gallery-img { max-width: 100%; max-height: 100%; border: 4px solid white; border-radius: 8px; object-fit: contain; }

        .next-arrow { right: 0; border-radius: 15px 0 0 15px; }

            .scrolling-logo { width: 60px; height: 60px; top: 15px; right: 15px; border-radius: 12px; }

            .hero-left { order: 2; width: 100%; text-align: center; }
            .hero-right { order: 1; width: 100%; margin-bottom: 20px; }
            .hero-right .visual-container { width: 220px; height: 220px; margin: 0 auto; }
            .title-main { font-size: 2.2rem; white-space: normal; line-height: 1.2; }
            .title-sub { font-size: 1.2rem; text-align: center; margin: 10px 0 30px; }

            .banner-side-doodle { width: 60px !important; height: 60px !important; flex-shrink: 0; }

                min-width: 0;

                flex-direction: column; 
                align-items: center; /* 确保内容垂直居中排列 */

                text-align: center !important;
                margin: 0 auto !important;
                letter-spacing: 1px !important;
            }
            .banner-text-content button {

</head>

    let curTid = 0; let curWidx = 0;

    function toggle(id) {
        document.getElementById('entrance-page').style.display = 'none';
        document.getElementById('themes-page').style.display = 'none';
        document.getElementById('detail-page').style.display = 'none';
        const el = document.getElementById(id);
        el.style.display = (id === 'entrance-page' ? 'flex' : 'block');
        window.scrollTo(0,0);
    }
    function showEntrance() { toggle('entrance-page'); }
    function showThemes() { toggle('themes-page'); }
    function showDetail(id) {
        curTid = id;
        const data = allThemesData[id];
        toggle('detail-page');
        document.getElementById('theme-title').innerText = data.title;
        const container = document.getElementById('works-container');
        container.innerHTML = data.works.map((item, index) => `
            <div class="work-box" onclick="openGallery(${index})">
                <div class="img-wrap"><img src="${item.file}" onerror="if(this.src.indexOf('.jpg.jpg')==-1)this.src+='.jpg'"></div>
                <div style="text-align:center; padding:10px;">
                    <div style="color:var(--brand-blue); font-size:0.85rem;">${item.school}</div>
                    <div style="font-weight:bold; font-size:1.1rem; margin-top:5px;">${item.name}</div>
                </div>
                <div class="praise-box">🌟 ${item.praise}</div>
            </div>`).join('');
    }

    function updateGalleryContent() {
        const item = allThemesData[curTid].works[curWidx];
        const img = document.getElementById('galleryImg');
        img.src = item.file;
        img.onerror = function() { if(this.src.indexOf('.jpg.jpg')==-1) this.src+='.jpg'; };
        document.getElementById('gallery-school').innerText = item.school;
        document.getElementById('gallery-name').innerText = item.name;
        document.getElementById('gallery-praise').innerText = "“" + item.praise + "”";
    }

    function openGallery(idx) {
        curWidx = idx;
        updateGalleryContent();
        document.getElementById('galleryModal').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }
    function changeGallery(dir) {
        const total = allThemesData[curTid].works.length;
        curWidx = (curWidx + dir + total) % total;
        updateGalleryContent();
    }
    function closeGallery() { document.getElementById('galleryModal').style.display = 'none'; document.body.style.overflow = 'auto'; }

    const grid = document.getElementById('themes-container');
    for(let i=1; i<=12; i++) {
        const div = document.createElement('div');
        const hasData = allThemesData[i];
        div.className = 'theme-card';
        div.innerHTML = hasData ? allThemesData[i].title : "主题 " + (i<10?'0'+i:i) + " (筹备中)";
        div.style.opacity = hasData ? "1" : "0.5";
        div.onclick = () => hasData ? showDetail(i) : alert("正在整理中...");
        grid.appendChild(div);
    }
    showEntrance();
</script>
